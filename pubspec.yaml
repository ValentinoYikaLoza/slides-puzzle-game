name: gambling_game
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ">=3.3.2 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  flutter_svg: ^2.0.11
  go_router: ^14.2.7
  intl: ^0.19.0
  shared_preferences: ^2.3.2
  flutter_native_splash: ^2.4.3
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter_native_splash:
  color: "#20e6f9"
  image: assets/images/logo.png
  android: true
  ios: true
  android_12:
    image: assets/images/logo.png
    color: "#20e6f9"


flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/gifs/
    - assets/images/
    - assets/icons/
    
